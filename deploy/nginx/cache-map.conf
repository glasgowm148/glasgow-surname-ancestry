# Include in nginx's http {} context. Scoped variables do not affect other sites.
map "$arg_v:$uri" $glasgow_resource_cache_control {
    default "public, max-age=0, must-revalidate";
    "~^[a-f0-9]{10}:/.*\.(?:css|js|json|csv)$" "public, max-age=31536000, immutable";
    "~:/data/catalogue-details/[^/]*[a-f0-9]{16}\.json$" "public, max-age=31536000, immutable";
    "~:/assets/research/fragments/[^/]*[a-f0-9]{16}\.html$" "public, max-age=31536000, immutable";
}

# Never keep a missing file or server error immutable, even on a hashed URL.
map "$status:$glasgow_resource_cache_control" $glasgow_cache_control {
    default "no-store";
    "~^(?:200|201|204|206|304):" $glasgow_resource_cache_control;
}
