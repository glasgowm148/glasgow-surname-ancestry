[project]
name = "glasgow-surname-ancestry"
version = "0.0.0"
description = "Glasgow surname research project using genealogy-research-workbench."
requires-python = ">=3.11"
dependencies = [
  "genealogy-research-workbench>=0.8.0,<0.9.0",
  "markdown-it-py>=3.0,<4",
  "beautifulsoup4>=4.12,<5",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "research",
  "surname-research",
  "www",
  "artifacts",
]

[tool.ruff.lint]
# Start with safe correctness checks; style cleanup can be added incrementally.
select = ["E9", "F63", "F7", "F82"]
