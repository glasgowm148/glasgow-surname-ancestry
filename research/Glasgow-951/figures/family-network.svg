<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1000" role="img" aria-labelledby="title desc"><title id="title">The documented Irish–Canadian family connection</title><desc id="desc">Three family groups remain distinct. The 1861 deed connects Daniel of Kilrea and Thomas of Lisnagaver to the Prescott siblings. Mary Glasgow Black and her children are identified in 1869. No record establishes Alexander’s parentage.</desc><rect width="560" height="1000" fill="#fffefa" /><g font-family="Arial,sans-serif" fill="#263b2d"><text x="25" y="36" font-size="23" fill="#263b2d" font-weight="700">Three groups; a new documented link</text><text x="25" y="63" font-size="17" fill="#263b2d">No common parent is established for these groups.</text><rect x="25" y="91" width="510" height="102" rx="8" fill="#edf2e8" stroke="#c4d1bf" /><text x="41" y="119" font-size="18" fill="#263b2d" font-weight="700">Alexander + Mary / Molly</text><text x="41" y="144" font-size="18" fill="#263b2d">Six children documented by baptisms, census</text><text x="41" y="169" font-size="18" fill="#263b2d">and later marriages; Mary Elder bridges Gortahar.</text><text x="25" y="232" font-size="15" fill="#62755e" font-weight="700">LISNAGAVER: CENSUS + MARRIAGE</text><rect x="25" y="251" width="510" height="52" rx="8" fill="#edf2e8" stroke="#c4d1bf" /><text x="41" y="279" font-size="18" fill="#263b2d" font-weight="700">John Glasgow, farmer — John-867’s named father</text><path d="M150 303 L150 326" stroke="#59745a" stroke-width="2" fill="none" /><rect x="25" y="326" width="230" height="80" rx="8" fill="#edf2e8" stroke="#c4d1bf" /><text x="41" y="354" font-size="18" fill="#263b2d" font-weight="700">John Glasgow-867</text><text x="41" y="379" font-size="18" fill="#263b2d">Lisnagaver house 34</text><rect x="305" y="326" width="230" height="80" rx="8" fill="#edf2e8" stroke="#c4d1bf" /><text x="321" y="354" font-size="18" fill="#263b2d" font-weight="700">Samuel Glasgow-2908</text><text x="321" y="379" font-size="18" fill="#263b2d">Called John’s brother</text><path d="M255 362 L305 362" stroke="#59745a" stroke-width="2" fill="none" /><text x="25" y="435" font-size="17" fill="#263b2d">The father’s profile identity remains unresolved.</text><text x="25" y="488" font-size="15" font-weight="700">KILREA / LISNAGAVER / PRESCOTT</text><rect x="25" y="507" width="510" height="223" rx="8" fill="#edf2e8" stroke="#c4d1bf" /><text x="41" y="539" font-size="18" font-weight="700">Daniel-3896 (Kilrea) + Thomas-987 (Lisnagaver)</text><text x="41" y="568" font-size="18">1861 deed: wives Margaret and Mary Anne</text><text x="41" y="601" font-size="18">Brothers Robert, Samuel and John of Prescott</text><text x="41" y="630" font-size="18">Brother James’s children; sister Mary Glasgow</text><text x="41" y="663" font-size="18">Robert’s 1849 will + the 1861 conveyance</text><text x="41" y="704" font-size="17">The will does not call James deceased.</text><rect x="25" y="755" width="510" height="146" rx="8" fill="#edf2e8" stroke="#c4d1bf" /><text x="41" y="788" font-size="18" font-weight="700">Mary Glasgow Black: Robert’s sister</text><text x="41" y="818" font-size="18">1869 deed names six Black children</text><text x="41" y="848" font-size="18">Drumoolish • Newburgh • Legrand</text><text x="41" y="878" font-size="17">Her parents are still unnamed.</text><text x="25" y="940" font-size="18">Alexander’s relationship to this group is open.</text><text x="25" y="970" font-size="17">Rochester Alexander’s identity remains separate.</text></g></svg>
