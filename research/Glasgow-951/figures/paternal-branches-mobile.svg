<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 981"><title>FT20271 genetic branches</title><rect width="360" height="981" fill="#fffefa"/><text x="18" y="30" font-family="Arial,sans-serif" font-size="20" fill="#263b2d" font-weight="700">A genetic connection; an</text><text x="18" y="53" font-family="Arial,sans-serif" font-size="20" fill="#263b2d" font-weight="700">unnamed ancestor</text><rect x="18" y="90" width="324" height="95" rx="7" fill="#edf2e8" stroke="#c4d1bf"/><text x="31" y="117" font-family="Arial,sans-serif" font-size="17" fill="#263b2d" font-weight="700">R-FT20271</text><text x="31" y="140" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">Shared named paternal branch. The</text><text x="31" y="163" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">common ancestor is unidentified.</text><path d="M24 277.0 L42 277.0" stroke="#59745a" stroke-width="2" fill="none"/><rect x="42" y="218" width="300" height="118" rx="7" fill="#edf2e8" stroke="#c4d1bf"/><text x="55" y="245" font-family="Arial,sans-serif" font-size="17" fill="#263b2d" font-weight="700">Alexander’s tested line</text><text x="55" y="268" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">Documented paternal ancestry</text><text x="55" y="291" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">reaches Alexander; displayed</text><text x="55" y="314" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">branch FT20271.</text><path d="M24 416.5 L42 416.5" stroke="#59745a" stroke-width="2" fill="none"/><rect x="42" y="369" width="300" height="95" rx="7" fill="#edf2e8" stroke="#c4d1bf"/><text x="55" y="396" font-family="Arial,sans-serif" font-size="17" fill="#263b2d" font-weight="700">James J’s tested line</text><text x="55" y="419" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">Same branch. Y-111 distance to</text><text x="55" y="442" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">Alexander’s tested line: three.</text><path d="M24 544.5 L42 544.5" stroke="#59745a" stroke-width="2" fill="none"/><rect x="42" y="497" width="300" height="95" rx="7" fill="#edf2e8" stroke="#c4d1bf"/><text x="55" y="524" font-family="Arial,sans-serif" font-size="17" fill="#263b2d" font-weight="700">Other FT20271 lines</text><text x="55" y="547" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">STR distances do not order every</text><text x="55" y="570" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">branch.</text><path d="M24 684.0 L42 684.0" stroke="#59745a" stroke-width="2" fill="none"/><rect x="42" y="625" width="300" height="118" rx="7" fill="#edf2e8" stroke="#c4d1bf"/><text x="55" y="652" font-family="Arial,sans-serif" font-size="17" fill="#263b2d" font-weight="700">Child branch R-FTE32242</text><text x="55" y="675" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">Two supplied pedigrees converge on</text><text x="55" y="698" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">James M through William Allen and</text><text x="55" y="721" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">Samuel Lyle.</text><path d="M24 185 L24 684.0" stroke="#59745a" stroke-width="2" fill="none"/><text x="18" y="776" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">These are genetic branches, not</text><text x="18" y="799" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">named brothers. Unknown</text><text x="18" y="822" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">generations separate the historic</text><text x="18" y="845" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">ancestors from their common</text><text x="18" y="868" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">ancestor.</text><text x="18" y="896" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">A displayed FT20271 label is not</text><text x="18" y="919" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">an audited negative for every</text><text x="18" y="942" font-family="Arial,sans-serif" font-size="16" fill="#263b2d">downstream SNP.</text></svg>