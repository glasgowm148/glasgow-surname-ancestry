<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 965" role="img" aria-labelledby="title desc"><title id="title">FT20271 and descendant line associations</title><desc id="desc">The FT20271 genetic cluster includes tested lines associated with Alexander, James J, other ancestors and the FTE32242 branch. No exact common ancestor or cousin degree is established. The FTE32242 association with James M depends on supplied pedigrees.</desc><rect width="560" height="965" fill="#fffefa"/><g font-family="Arial,sans-serif" fill="#263b2d"><text x="25" y="36" font-size="22" fill="#263b2d" font-weight="700">Genetic kinship; an unnamed ancestor</text><text x="25" y="63" font-size="17" fill="#263b2d">Genetic branches ≠ a diagram of named siblings</text><rect x="25" y="90" width="510" height="77" rx="8" fill="#edf2e8" stroke="#c4d1bf"/><text x="41" y="118" font-size="18" fill="#263b2d" font-weight="700">R-FT20271</text><text x="41" y="143" font-size="18" fill="#263b2d">Shared named paternal branch; ancestor unidentified</text><path d="M48 167 L48 623" stroke="#59745a" stroke-width="2" fill="none"/><path d="M48 245 L80 245" stroke="#59745a" stroke-width="2" fill="none"/><rect x="80" y="205" width="455" height="83" rx="8" fill="#edf2e8" stroke="#c4d1bf"/><text x="96" y="233" font-size="18" fill="#263b2d" font-weight="700">Alexander’s tested descendant line</text><text x="96" y="258" font-size="18" fill="#263b2d">Documented paternal ancestry reaches Alexander.</text><path d="M48 371 L80 371" stroke="#59745a" stroke-width="2" fill="none"/><rect x="80" y="331" width="455" height="83" rx="8" fill="#edf2e8" stroke="#c4d1bf"/><text x="96" y="359" font-size="18" fill="#263b2d" font-weight="700">James J’s tested descendant line</text><text x="96" y="384" font-size="18" fill="#263b2d">Y-111 distance to Alexander’s tested line: 3.</text><path d="M48 497 L80 497" stroke="#59745a" stroke-width="2" fill="none"/><rect x="80" y="457" width="455" height="83" rx="8" fill="#edf2e8" stroke="#c4d1bf"/><text x="96" y="485" font-size="18" fill="#263b2d" font-weight="700">Other FT20271 descendant lines</text><text x="96" y="510" font-size="18" fill="#263b2d">STR distance alone does not order all branches.</text><path d="M48 623 L80 623" stroke="#59745a" stroke-width="2" fill="none"/><rect x="80" y="583" width="455" height="83" rx="8" fill="#edf2e8" stroke="#c4d1bf"/><text x="96" y="611" font-size="18" fill="#263b2d" font-weight="700">R-FTE32242 — downstream branch</text><text x="96" y="636" font-size="18" fill="#263b2d">Two supplied pedigrees converge on James M.</text><text x="25" y="712" font-size="18" fill="#263b2d" font-weight="700">The historical association of FTE32242:</text><rect x="80" y="735" width="455" height="83" rx="8" fill="#edf2e8" stroke="#c4d1bf"/><text x="96" y="763" font-size="18" fill="#263b2d" font-weight="700">James M Glasgow-193 — supplied pedigrees</text><text x="96" y="788" font-size="18" fill="#263b2d">Two lines through William Allen and Samuel Lyle</text><text x="25" y="852" font-size="17" fill="#263b2d">Unknown numbers of generations connect the named</text><text x="25" y="877" font-size="17" fill="#263b2d">ancestors to the common genetic ancestor.</text><text x="25" y="913" font-size="17" fill="#263b2d">A displayed FT20271 label is not an audited negative</text><text x="25" y="938" font-size="17" fill="#263b2d">call for every downstream SNP.</text></g></svg>