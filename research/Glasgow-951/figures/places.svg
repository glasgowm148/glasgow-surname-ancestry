<circle cx="101" cy="242" r="9" fill="#345440"/><text x="28" y="281" font-size="22" font-weight="700">Lisnagaver</text><text x="28" y="306" font-size="16">Family here by 1843</text><text x="28" y="329" font-size="16">1851 household · later lot 25</text>
