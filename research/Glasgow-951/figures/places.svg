<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" role="img" aria-labelledby="title desc">
<title id="title">Alexander's three principal family localities</title><desc id="desc">Gortereghy lies south of adjoining Lisnagaver. Gortahar lies northeast, beyond Moneyleck. Points locate townlands, not dwellings. Family baptisms place the couple at Gortereghy in1837–1838 and Lisnagaver by1843; the Elder family and probable1888 death connect them with Gortahar.</desc>
