[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genealogy-research-workbench"
version = "0.1.0"
description = "Platform-neutral, evidence-led genealogy research toolkit"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
genealogy = "genealogy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genealogy = [
  "starter/*",
  "starter/.gitignore",
  "starter/cases/*",
  "starter/skills/genealogy-research/*",
]
